spring.application.name=order-service

spring.datasource.url=jdbc:mysql://mysql:3306/revshop_db
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8084

jwt.secret=your-super-secret-key-for-revshop-user-service-2026
jwt.expiration=86400000

cart.service.url=http://cart-service:8083
product.service.url=http://product-service:8082
payment.service.url=http://payment-service:8085
notification.service.url=http://notification-service:8086

product.internal.key=revshop-internal-2026

eureka.client.service-url.defaultZone=http://service-discovery:8761/eureka/