spring.application.name=api-gateway
server.port=9000

spring.cloud.gateway.server.webmvc.routes[0].id=product-service-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://product-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/products/**,/api/categories/**

spring.cloud.gateway.server.webmvc.routes[1].id=user-service-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webmvc.routes[2].id=cart-service-route
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://cart-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/cart/**

spring.cloud.gateway.server.webmvc.routes[3].id=order-service-route
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/orders/**

spring.cloud.gateway.server.webmvc.routes[4].id=payment-service-route
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://payment-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/payments/**

spring.cloud.gateway.server.webmvc.routes[5].id=notification-service-route
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://notification-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/notifications/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true